# -----------------------------------------------------------------------------
# Sveltia CMS configuration
#
# This file decides what the editing screens look like. The fields here must
# stay in step with src/content.config.ts. If you add a field in one place,
# add it in the other.
#
# Docs: https://sveltiacms.app/en/docs
# -----------------------------------------------------------------------------

backend:
  name: github
  repo: jonnymarshall/gigicollective
  branch: main
  # The Cloudflare Worker that handles signing in. See docs/03-cms-login-setup.md.
  base_url: https://sveltia-cms-auth.jonnymarshall5.workers.dev

# Where uploaded images are stored in the repository, and the address they are
# served from on the live site.
media_folder: public/images/uploads
public_folder: /images/uploads

# Powers the "View site" link in the editor.
site_url: https://gigicollective.com

# Preview pane on, so she can see the content taking shape rather than typing
# into blank boxes. It shows the fields laid out, not the finished site styling.
editor:
  preview: true

collections:
  # ---------------------------------------------------------------------------
  - name: settings
    label: Site settings
    description: Things that appear on every page, and the front page content.
    files:
      - name: site
        label: General
        file: src/data/site.json
        description: Site name, contact details, and what appears in the footer.
        fields:
          - { name: title, label: Site name, widget: string, hint: "Shown top left on every page, and in the browser tab." }
          - { name: tagline, label: Tagline, widget: string, hint: "A very short line that sits above the main heading on the front page." }
          - { name: description, label: Search engine description, widget: text, hint: "One or two sentences. Google shows this under your site name in search results." }
          - { name: email, label: Contact email address, widget: string, required: false }
          - { name: showBlog, label: Show the Blog section, widget: boolean, default: true }
          - { name: showWork, label: Show the Work section, widget: boolean, default: true }
          - { name: footerText, label: Footer text, widget: string }
          - name: social
            label: Social links
            widget: list
            required: false
            label_singular: link
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Name, widget: string, hint: "For example: Instagram" }
              - { name: url, label: Web address, widget: string, hint: "The full address, starting with https://" }

      - name: home
        label: Front page
        file: src/data/home.json
        description: Everything that appears on the front page, top to bottom.
        fields:
          - { name: heroHeading, label: Big heading, widget: string, hint: "The first thing anyone reads. Keep it to a few words." }
          - { name: heroEyebrow, label: Small line above, widget: string, required: false, hint: "A few words in small capitals." }
          - { name: heroSubheading, label: Sentence below the heading, widget: text, required: false }
          - { name: heroImage, label: Background photograph, widget: image, required: false, hint: "Sits behind the heading, darkened so the text stays readable. A wide, calm photo works best." }
          - { name: ctaLabel, label: Button text, widget: string, required: false, hint: "Leave blank for no button." }
          - { name: ctaUrl, label: Button goes to, widget: string, required: false, default: "/work" }

          - { name: introEyebrow, label: "Intro: small line above", widget: string, required: false }
          - { name: introHeading, label: "Intro: heading", widget: string, required: false }
          - { name: introText, label: "Intro: text", widget: text, required: false }
          - { name: introImage, label: "Intro: photograph", widget: image, required: false, hint: "Sits beside the text. A portrait photo suits this spot." }
          - { name: introLinkLabel, label: "Intro: button text", widget: string, required: false }
          - { name: introLinkUrl, label: "Intro: button goes to", widget: string, required: false }

          - name: sections
            label: Extra sections
            widget: list
            required: false
            label_singular: section
            summary: "{{fields.heading}}"
            hint: "Optional. These appear between the intro and the project list, alternating sides automatically."
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text, required: false }
              - { name: image, label: Image, widget: image, required: false }
              - { name: linkLabel, label: Button text, widget: string, required: false }
              - { name: linkUrl, label: Button goes to, widget: string, required: false }

          - { name: showFeaturedWork, label: Show recent work on the front page, widget: boolean, default: true }
          - { name: featuredWorkEyebrow, label: "Work: small line above", widget: string, required: false, default: "Featured projects" }
          - { name: featuredWorkHeading, label: "Work: heading", widget: string, default: "A collection of thoughtful spaces" }

          - { name: showLatestPosts, label: Show latest journal posts on the front page, widget: boolean, default: true }
          - { name: latestPostsEyebrow, label: "Journal: small line above", widget: string, required: false, default: "Journal" }
          - { name: latestPostsHeading, label: "Journal: heading", widget: string, default: "From the journal" }

          - { name: closingEyebrow, label: "Closing: small line above", widget: string, required: false, default: "Inquire" }
          - { name: closingHeading, label: "Closing: heading", widget: string, required: false, hint: "The dark band at the bottom. Leave blank to hide it." }
          - { name: closingText, label: "Closing: text", widget: text, required: false }
          - { name: closingButtonLabel, label: "Closing: button text", widget: string, required: false }
          - { name: closingButtonUrl, label: "Closing: button goes to", widget: string, required: false }
          - { name: closingImage, label: "Closing: photograph", widget: image, required: false }

      - name: theme
        label: Look and feel
        file: src/data/theme.json
        description: Colours and fonts for the whole site. Changing these changes every page.
        fields:
          - name: palette
            label: Colour scheme
            widget: select
            default: clay
            options:
              - { label: "Clay and bone (warm browns)", value: clay }
              - { label: "Sage and linen (soft greens)", value: sage }
              - { label: "Stone and mist (cool greys)", value: stone }
              - { label: "Terracotta and sand (warm orange)", value: terracotta }
              - { label: "Ink and oat (deep blue-grey)", value: ink }
          - name: headingFont
            label: Heading font
            widget: select
            default: serif
            options:
              - { label: "Serif (elegant, with fine strokes)", value: serif }
              - { label: "Sans serif (clean and plain)", value: sans }
          - name: bodyFont
            label: Body font
            widget: select
            default: sans
            options:
              - { label: "Sans serif (easiest to read)", value: sans }
              - { label: "Serif", value: serif }
          - name: headingStyle
            label: Heading style
            widget: select
            default: classic
            options:
              - { label: "Classic", value: classic }
              - { label: "Airy and spaced out (capitals)", value: airy }
              - { label: "Bold and close together", value: bold }
          - name: corners
            label: Corner style
            widget: select
            default: square
            options:
              - { label: "Square", value: square }
              - { label: "Slightly rounded", value: soft }
              - { label: "Rounded", value: round }

  # ---------------------------------------------------------------------------
  - name: pages
    label: Pages
    label_singular: page
    description: Standalone pages such as About, Services, or Contact.
    folder: src/content/pages
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    sortable_fields: [navOrder, title]
    fields:
      - { name: title, label: Page title, widget: string }
      - { name: description, label: Short summary, widget: text, required: false, hint: "One sentence. Used by Google, and shown under the title on the page." }
      - { name: heroImage, label: Header image, widget: image, required: false }
      - { name: showInNav, label: Show in the top menu, widget: boolean, default: true }
      - { name: navOrder, label: Menu position, widget: number, default: 0, value_type: int, hint: "Lower numbers appear further left." }
      - { name: draft, label: Draft, widget: boolean, default: false, hint: "Turn on to hide this page from the live site while you work on it." }
      - name: blocks
        label: Page sections
        label_singular: section
        widget: list
        required: false
        hint: "Build the page by adding sections. Drag them by the handle to reorder."
        types:
          - name: text
            label: Text
            summary: "Text: {{fields.heading}}"
            fields:
              - { name: eyebrow, label: Small line above the heading, widget: string, required: false }
              - { name: heading, label: Heading, widget: string, required: false }
              - { name: text, label: Text, widget: markdown }
              - name: width
                label: Width
                widget: select
                default: narrow
                options:
                  - { label: "Narrow (easiest to read)", value: narrow }
                  - { label: "Full width", value: wide }

              - name: background
                label: Background shade
                widget: select
                default: bg
                options:
                  - { label: "Page background", value: bg }
                  - { label: "Slightly darker band", value: tint }
                  - { label: "Dark band", value: dark }

          - name: imageText
            label: Text beside an image
            summary: "Text and image: {{fields.heading}}"
            fields:
              - { name: eyebrow, label: Small line above the heading, widget: string, required: false }
              - { name: heading, label: Heading, widget: string, required: false }
              - { name: text, label: Text, widget: markdown, required: false }
              - { name: image, label: Image, widget: image }
              - name: imageSide
                label: Put the image on the
                widget: select
                default: right
                options:
                  - { label: Right, value: right }
                  - { label: Left, value: left }
              - { name: linkLabel, label: Button text, widget: string, required: false, hint: "Leave blank for no button." }
              - { name: linkUrl, label: Button goes to, widget: string, required: false }

              - name: background
                label: Background shade
                widget: select
                default: bg
                options:
                  - { label: "Page background", value: bg }
                  - { label: "Slightly darker band", value: tint }
                  - { label: "Dark band", value: dark }

          - name: image
            label: A single image
            summary: "Image: {{fields.caption}}"
            fields:
              - { name: image, label: Image, widget: image }
              - { name: caption, label: Caption, widget: string, required: false }
              - name: width
                label: Width
                widget: select
                default: wide
                options:
                  - { label: "Inside the page margins", value: wide }
                  - { label: "Edge to edge", value: full }

              - name: background
                label: Background shade
                widget: select
                default: bg
                options:
                  - { label: "Page background", value: bg }
                  - { label: "Slightly darker band", value: tint }
                  - { label: "Dark band", value: dark }

          - name: gallery
            label: Photo gallery
            summary: "Gallery: {{fields.heading}}"
            fields:
              - { name: eyebrow, label: Small line above the heading, widget: string, required: false }
              - { name: heading, label: Heading, widget: string, required: false }
              - name: columns
                label: Photos per row
                widget: select
                default: 3
                options:
                  - { label: "2 (large)", value: 2 }
                  - { label: "3 (medium)", value: 3 }
                  - { label: "4 (small)", value: 4 }
              - name: images
                label: Photos
                label_singular: photo
                widget: list
                fields:
                  - { name: image, label: Photo, widget: image }
                  - { name: caption, label: Caption, widget: string, required: false }

              - name: background
                label: Background shade
                widget: select
                default: bg
                options:
                  - { label: "Page background", value: bg }
                  - { label: "Slightly darker band", value: tint }
                  - { label: "Dark band", value: dark }

          - name: quote
            label: Pull quote
            summary: "Quote: {{fields.quote}}"
            fields:
              - { name: eyebrow, label: Small line above, widget: string, required: false }
              - { name: quote, label: Quote, widget: text, hint: "Do not add quotation marks, they are added for you." }
              - { name: attribution, label: Who said it, widget: string, required: false }
              - { name: role, label: "Their role or project", widget: string, required: false }

              - name: background
                label: Background shade
                widget: select
                default: bg
                options:
                  - { label: "Page background", value: bg }
                  - { label: "Slightly darker band", value: tint }
                  - { label: "Dark band", value: dark }

          - name: cta
            label: Call to action box
            summary: "Call to action: {{fields.heading}}"
            fields:
              - { name: eyebrow, label: Small line above, widget: string, required: false }
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text, required: false }
              - { name: buttonLabel, label: Button text, widget: string, required: false }
              - { name: buttonUrl, label: Button goes to, widget: string, required: false, hint: "For example /contact" }
              - { name: image, label: Photograph, widget: image, required: false }

              - name: background
                label: Background shade
                widget: select
                default: bg
                options:
                  - { label: "Page background", value: bg }
                  - { label: "Slightly darker band", value: tint }
                  - { label: "Dark band", value: dark }

          - name: features
            label: Row of cards
            summary: "Cards: {{fields.heading}}"
            fields:
              - { name: eyebrow, label: Small line above the heading, widget: string, required: false }
              - { name: heading, label: Heading, widget: string, required: false }
              - { name: numbered, label: Number the cards, widget: boolean, default: false, hint: "Shows 01, 02, 03 instead of the small images. Good for describing a process." }
              - name: items
                label: Cards
                label_singular: card
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Text, widget: text, required: false }
                  - { name: image, label: Small image, widget: image, required: false }
              - name: background
                label: Background shade
                widget: select
                default: bg
                options:
                  - { label: "Page background", value: bg }
                  - { label: "Slightly darker band", value: tint }
                  - { label: "Dark band", value: dark }
      - { name: body, label: Extra text below the sections, widget: markdown, required: false, hint: "Usually left empty. Anything here appears underneath all the sections above." }

  # ---------------------------------------------------------------------------
  - name: posts
    label: Blog posts
    label_singular: post
    description: Dated articles that appear on the blog.
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    sortable_fields: [pubDate, title]
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Short summary, widget: text, required: false, hint: "One or two sentences. Shown in the blog list and in Google results." }
      - { name: pubDate, label: Date published, widget: datetime, date_format: "DD/MM/YYYY", time_format: false, picker_utc: true }
      - { name: updatedDate, label: Date updated, widget: datetime, date_format: "DD/MM/YYYY", time_format: false, picker_utc: true, required: false }
      - { name: heroImage, label: Header image, widget: image, required: false }
      - { name: tags, label: Tags, widget: list, required: false, default: [], hint: "Optional. Group related posts together." }
      - { name: draft, label: Draft, widget: boolean, default: false, hint: "Turn on to keep this off the live site while you work on it." }
      - { name: body, label: Post content, widget: markdown }

  # ---------------------------------------------------------------------------
  - name: projects
    label: Work
    label_singular: project
    description: Projects, case studies, or photo galleries.
    folder: src/content/projects
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Short summary, widget: text, required: false }
      - { name: coverImage, label: Cover image, widget: image, required: false, hint: "The picture shown in the Work list." }
      - { name: date, label: Date, widget: datetime, date_format: "DD/MM/YYYY", time_format: false, picker_utc: true }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Description, widget: markdown, required: false }
      - name: gallery
        label: Photo gallery
        widget: list
        required: false
        label_singular: photo
        summary: "{{fields.caption}}"
        fields:
          - { name: image, label: Photo, widget: image }
          - { name: caption, label: Caption, widget: string, required: false }
