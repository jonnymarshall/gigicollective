name: Build and deploy site

on:
  # Runs when content is published from the CMS, or when you push code.
  push:
    branches: [main]
  # Lets you rebuild by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If two publishes land close together, let the first finish rather than
# cancelling it, so nothing is half-deployed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build site
        uses: withastro/action@v6
        with:
          node-version: 22
        env:
          # Set the repository variable PUBLIC_NOINDEX to "true" while the site is
          # staged, so search engines ignore it. Delete the variable on launch day.
          #   gh variable set PUBLIC_NOINDEX --body true    (turn on)
          #   gh variable delete PUBLIC_NOINDEX             (turn off, at launch)
          PUBLIC_NOINDEX: ${{ vars.PUBLIC_NOINDEX }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
